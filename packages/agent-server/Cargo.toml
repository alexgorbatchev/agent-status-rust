[package]
name = "agent-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Read-only Agent Status queries and live event streams"

[dependencies]
agent-common = { path = "../agent-common" }
agent-status-store = { path = "../agent-status-store" }
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "40210e689762f6606776764bb3696e2685198c2e" }
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["string"] }
clap_complete = "4"
reliakit-csv = "1"
dirs = "7"
futures-util = "0.3"
goglob = { version = "0.2", default-features = false }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy", "json", "stream"] }
rusqlite = { version = "0.39", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
async-stream = "0.3"
tower-http = { version = "0.7", features = ["cors", "timeout"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

