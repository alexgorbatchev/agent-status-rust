[package]
name = "agent-common"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared telemetry contracts, usage evidence, model capacity resolution, and structured logging"

[dependencies]
agent-parser = { path = "../../../agent-parser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
flexi_logger = { version = "0.31", default-features = false, features = ["compress"] }
dirs = "7"

[dev-dependencies]
tempfile = "3"
flate2 = "1"
