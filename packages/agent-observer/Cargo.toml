[package]
name = "agent-observer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local agent telemetry observer, workspace resolver, and acknowledged WebSocket delivery"

[dependencies]
agent-common = { path = "../agent-common" }
agent-watcher = { git = "https://github.com/alexgorbatchev/agent-watcher-rust.git", rev = "9c7532c9950c6fd188374e8ff7266480c558ab7c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "7"
hostname = "0.4"
uzers = "0.12"
gix-url = "0.36"
path-clean = "1"
pathdiff = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
backoff = "0.4"
thiserror = "2"
url = "2"
percent-encoding = "2"
clap = { version = "4.6.7", features = ["string"] }
clap_complete = "4.6.5"
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "40210e689762f6606776764bb3696e2685198c2e" }
go-duration = "0.2.0"

[dev-dependencies]
tempfile = "3"
